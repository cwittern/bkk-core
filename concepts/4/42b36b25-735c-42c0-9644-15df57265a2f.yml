type: concept
concept: ABANDON
definition: DISCARD SOMEONE WHOM ONE SHOULD CARE FOR.
criteria:
- type: old-chinese-criteria
  text: '1. The most general term for discarding something reluctantly, abandoning what one would have liked to keep, care for or continue to do, is qì [[棄]], which is more current under the concept DISCARD.

    2. Shě [[捨]]/[[舍]] is less dramatic and less abrupt and can have abstract objects.'
